name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install correct Gradle version
        run: |
          GRADLE_VER=$(grep -o 'gradle-[0-9.]*-bin' gradle/wrapper/gradle-wrapper.properties | sed 's/gradle-//;s/-bin//')
          echo "Gradle version needed: $GRADLE_VER"
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip"
          unzip -q "gradle-${GRADLE_VER}-bin.zip"
          echo "$PWD/gradle-${GRADLE_VER}/bin" >> $GITHUB_PATH

      - name: Create missing launcher icons
        run: |
          python3 -c "
          import os, base64
          d = base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==')
          for x in ['mdpi','hdpi','xhdpi','xxhdpi','xxxhdpi']:
              os.makedirs(f'app/src/main/res/mipmap-{x}', exist_ok=True)
              for n in ['ic_launcher.png','ic_launcher_round.png']:
                  open(f'app/src/main/res/mipmap-{x}/{n}','wb').write(d)
          "

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersianCodingKeyboard-APK
          path: app/build/outputs/apk/release/*.apk
